<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="A growing collection of mathematical and computer science animations by om, made with Manim.">
  <title>Manimations — Math in Motion</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="gallery.css">
  <script src="gallery.js" defer></script>
</head>
<body>
  <a class="skip" href="#collection">Skip to animations</a>
  <main>
    <section class="intro" aria-labelledby="heading">
      <h1 id="heading">Manimations</h1>
      <p class="intro-copy">Math in Motion</p>
    </section>
    <section id="collection" aria-labelledby="collection-heading">
      <h2 id="collection-heading" class="visually-hidden">Animations</h2>
      <div class="toolbar">
        <label class="filter-label">Topic
          <select id="topic"><option value="">All topics</option></select>
        </label>
        <button id="autoplay" type="button" aria-pressed="true">Autoplay: on</button>
      </div>
      <p class="visually-hidden" id="playback-note">Visible clips play automatically, muted. Use the player controls to pause or enable sound.</p>
      <p class="visually-hidden" id="status" role="status" aria-live="polite">Loading the collection…</p>
      <div id="gallery" class="gallery"></div>
      <button id="load-more" class="load-more" type="button" hidden>Load more animations</button>
      <noscript><p>Enable JavaScript to browse the collection, or <a href="animations.json">read the animation list</a>.</p></noscript>
    </section>
  </main>
</body>
</html>
